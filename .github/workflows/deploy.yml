# `deploy-v0.1` Section 4.2: the deploy, started by hand and by nothing else.
#
# The only trigger is `workflow_dispatch`. There is no deploy on push, merge,
# schedule or any other event, and no step waits on an approval: required
# reviewers are not available on this repository's plan (#205). Since `0.6.0`
# (ADR-0007, #265) the owner or the Claude Code writer session starts a run,
# through the owner's account. The recorded human decision for a deploy is the
# owner's merge of the commit to `main`; the run's triggering actor and URL
# are written into the artifact as its evidence.
#
# The guard is the job's first condition. It bounds the run to the owner's
# GitHub account and to `main`. No agent-loop run and no scheduled or
# event-driven automation dispatches this workflow (Section 4.2).
#
# `mode: checks` (Section 4.8) runs the deployed checks against what is
# already deployed. It creates no secret and applies no template, pushes no
# image, restarts nothing, provisions nothing and rolls nothing back; the one
# deployed change it makes is the runner's firewall window, which Section 4.2
# opens for the checks and the final step closes. `cases` narrows a checks run to
# named groups. In either mode, a failure among the fast groups skips the slow
# ones, which are recorded as not run.
#
# This file is the first half of the deploy. It builds and ships one commit:
# the three database secrets, the provisioning definitions, the image, and the
# database provisioned from that commit inside a firewall window that is always
# closed; then the Section 4.8 deployed checks (DP-003, DP-004, DP-005,
# DP-007, DP-008, DP-009, DP-010, DP-012, DP-014, the WF rows and the MC rows)
# and, on a failure, the rollback to the last passing commit, with DP-006,
# DP-007's comparison and DP-011.
#
# No secret is in this file, in a GitHub Secret, or in a log. The deploy job
# reads the five identifiers #205 lists from the `production` environment's
# Variables; every password lives in Key Vault (Section 4.3).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy: build, ship and check this commit. checks: check what is deployed, changing nothing."
        type: choice
        options: [deploy, checks]
        default: deploy
      cases:
        description: "checks mode only: comma-separated groups (AZURE,HTTP,DP-004,DP-007,WF/MC,DP-008,DP-006). Empty runs all. DP-003's scan always runs."
        type: string
        default: ""
      create_missing_secrets:
        description: "Owner only: create a database password Key Vault does not hold. Off, a missing password stops the run."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # DP-013: the first condition, before anything logs in to Azure.
    if: github.actor == 'OKJ1105' && github.triggering_actor == 'OKJ1105' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The environment admits `main` only (Section 4.3, #205); the federated
    # credential trusts this environment and nothing else.
    environment: production
    # DP-006 and DP-007's local side: the same commit, provisioned by the same
    # module into a job-scoped PostgreSQL that exists only for this run.
    services:
      local:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local_superuser_not_a_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      KEY_VAULT: ${{ vars.AZURE_KEY_VAULT_NAME }}
      COMMIT: ${{ github.sha }}
      MODE: ${{ inputs.mode || 'deploy' }}
      CASES: ${{ inputs.cases }}
      # Section 4.6: the portfolio site's origin, the one origin both apps
      # admit a preflight from. Passed to the template and to DP-019.
      CORS_ORIGIN: https://junokaniwa.com
      # Flexible Server refuses a connection without TLS (Section 4.5).
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      # Editable, as every other workflow installs it: a plain install leaves
      # the package's data files -- the conformance runner's registered
      # expected results -- behind, and the deployed runner then fails every
      # case as unregistered (run 36662412772, DP-007).
      - name: Install the package
        run: python -m pip install --quiet -e .

      - name: Log in to Azure as the deploy identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Section 4.3 and DP-015: exactly three secrets, each written only when
      # it does not exist, so a later run never regenerates one. The value
      # goes to Key Vault through a file that only this step can read, never
      # on a command line and never to the log.
      - name: Create the database passwords that do not exist yet
        if: env.MODE == 'deploy'
        env:
          CREATE_MISSING_SECRETS: ${{ inputs.create_missing_secrets }}
        run: |
          set -euo pipefail
          umask 077
          # A password file never outlives the step, whatever fails (#235 N8).
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          for name in postgres-admin-password mvp-provisioning-password mvp-runtime-password; do
            # Only a not-found answer leads to a new value. Any other failure
            # (throttling, an expired token, a role not yet effective) stops
            # the run, so an existing password is never overwritten (#235 B1).
            error="$scratch/error"
            status=0
            az keyvault secret show --vault-name "$KEY_VAULT" --name "$name" --query id --output none 2>"$error" || status=$?
            if [ "$status" -eq 0 ]; then
              rm -f "$error"
              echo "$name exists; not regenerated"
              continue
            fi
            if ! grep -q 'SecretNotFound' "$error"; then
              cat "$error" >&2
              exit 1
            fi
            rm -f "$error"
            # Creating a secret is the owner's act (Section 4.3, #265 B2): the
            # owner sets this input when starting the run, and the writer
            # session never does.
            if [ "$CREATE_MISSING_SECRETS" != "true" ]; then
              echo "$name is missing; only a run the owner starts with create_missing_secrets creates it"
              exit 1
            fi
            file="$scratch/value"
            # 43 URL-safe characters, plus one of each class the server's
            # administrator password policy asks for.
            python -c 'import secrets; print(secrets.token_urlsafe(32) + "aA1", end="")' > "$file"
            az keyvault secret set --vault-name "$KEY_VAULT" --name "$name" --file "$file" --output none
            rm -f "$file"
            echo "$name created"
          done

      # The template's secret-scoped grants need the secrets above to exist,
      # which is why this step comes after them (#231 N3).
      - name: Apply the provisioning definitions
        id: infra
        run: |
          set -euo pipefail
          outputs_to_step() {
            for key in registryName registryLoginServer serverName serverHost surfaceName relayName surfaceHost relayHost; do
              echo "$key=$(jq -r ".$key.value" <<<"$1")" >> "$GITHUB_OUTPUT"
            done
          }
          if [ "$MODE" = "checks" ]; then
            # Nothing is applied. The names come from the newest template
            # deployment that succeeded, and the commit under check is the tag
            # surface is running, so every check reads what is deployed (#265).
            name="$(az deployment group list --resource-group "$RESOURCE_GROUP" \
              --query "sort_by([?starts_with(name, 'deploy-') && properties.provisioningState=='Succeeded'], &properties.timestamp)[-1].name" \
              --output tsv)"
            [ -n "$name" ] || { echo "no succeeded template deployment to check"; exit 1; }
            outputs="$(az deployment group show --resource-group "$RESOURCE_GROUP" --name "$name" \
              --query properties.outputs --output json)"
            outputs_to_step "$outputs"
            running="$(az webapp config show --resource-group "$RESOURCE_GROUP" \
              --name "$(jq -r .surfaceName.value <<<"$outputs")" --query linuxFxVersion --output tsv)"
            deployed="${running##*:}"
            [[ "$deployed" =~ ^[0-9a-f]{40}$ ]] || { echo "surface runs no commit-tagged image"; exit 1; }
            # A name of its own: a job-level `env` value is not one to rely on
            # `GITHUB_ENV` overriding.
            echo "DEPLOYED_COMMIT=$deployed" >> "$GITHUB_ENV"
            # DP-003's image half reads the local image store, which only the
            # deploy-mode build fills. Pull the deployed image instead, by the
            # deploy identity's AcrPush, which includes pull (#266 B1).
            az acr login --name "$(jq -r .registryName.value <<<"$outputs")"
            docker pull --quiet "$(jq -r .registryLoginServer.value <<<"$outputs")/evidence-first-rag:$deployed"
            echo "Checking the deployed commit $deployed; this checkout is ${{ github.sha }}."
            exit 0
          fi
          admin="$(az keyvault secret show --vault-name "$KEY_VAULT" --name postgres-admin-password --query value --output tsv)"
          echo "::add-mask::$admin"
          parameters="$(mktemp)"
          trap 'rm -f "$parameters"' EXIT
          ADMIN="$admin" python - "$parameters" <<'PY'
          import json, os, sys
          document = {
              "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
              "contentVersion": "1.0.0.0",
              "parameters": {
                  "commit": {"value": os.environ["COMMIT"]},
                  "keyVaultName": {"value": os.environ["KEY_VAULT"]},
                  "adminSecret": {"value": os.environ["ADMIN"]},
                  # `relay-v0.1` Section 8.3 registers it; the test pins the two together.
                  "relayDailyCeiling": {"value": "67"},
                  "corsOrigin": {"value": os.environ["CORS_ORIGIN"]},
              },
          }
          with open(sys.argv[1], "w") as handle:
              json.dump(document, handle)
          PY
          outputs="$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "deploy-$COMMIT" \
            --template-file infra/main.bicep \
            --parameters "@$parameters" \
            --query properties.outputs --output json)"
          rm -f "$parameters"
          outputs_to_step "$outputs"

      # Section 4.1: pushed under the commit tag only, by role. No registry
      # credential exists (DP-014), and no image or tag is deleted.
      - name: Build and push the image
        id: image
        if: env.MODE == 'deploy'
        run: |
          set -euo pipefail
          image="${{ steps.infra.outputs.registryLoginServer }}/evidence-first-rag:$COMMIT"
          docker build --tag "$image" .
          # The AcrPush assignment the template just created can take minutes
          # to take effect, so the login and push are retried (#235 N4).
          for attempt in 1 2 3 4 5; do
            if az acr login --name "${{ steps.infra.outputs.registryName }}" && docker push "$image"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep 60
          done
          echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")" >> "$GITHUB_OUTPUT"

      - name: Restart both apps on the pushed image
        if: env.MODE == 'deploy'
        run: |
          set -euo pipefail
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "${{ steps.infra.outputs.surfaceName }}"
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "${{ steps.infra.outputs.relayName }}"

      # Section 4.2: the firewall opens to this runner for provisioning and the
      # deployed checks, and the final step below closes it whatever happened.
      - name: Open the database firewall to this runner
        id: firewall
        # A narrowed checks run opens it only when a group it runs connects to
        # the database: DP-004, DP-007, or DP-006, which brings DP-007 (#266 N5).
        if: env.MODE == 'deploy' || env.CASES == '' || contains(env.CASES, 'DP-004') || contains(env.CASES, 'DP-007') || contains(env.CASES, 'DP-006')
        run: |
          set -euo pipefail
          # A rule an earlier run failed to close is removed first, so no
          # runner address stays admitted past its own run (#235 N1).
          for stale in $(az postgres flexible-server firewall-rule list \
              --resource-group "$RESOURCE_GROUP" --server-name "${{ steps.infra.outputs.serverName }}" \
              --query "[?starts_with(name, 'deploy-runner-')].name" --output tsv); do
            az postgres flexible-server firewall-rule delete \
              --resource-group "$RESOURCE_GROUP" --server-name "${{ steps.infra.outputs.serverName }}" \
              --name "$stale" --yes --output none
          done
          # Recorded before the create, so the close step runs whatever the
          # create's exit status (#235 N5).
          echo "rule=deploy-runner-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          address="$(curl --silent --show-error --fail https://api.ipify.org)"
          az postgres flexible-server firewall-rule create \
            --resource-group "$RESOURCE_GROUP" \
            --server-name "${{ steps.infra.outputs.serverName }}" \
            --name "deploy-runner-${{ github.run_id }}" \
            --start-ip-address "$address" --end-ip-address "$address" \
            --output none

      # DP-001: exactly the module CI and the local stack run, from the
      # committed `sql/` and `fixtures/`, rebuilt from empty on every deploy.
      - name: Provision the database from this commit
        id: provision
        if: env.MODE == 'deploy'
        run: |
          set -euo pipefail
          read_secret() { az keyvault secret show --vault-name "$KEY_VAULT" --name "$1" --query value --output tsv; }
          PGPASSWORD="$(read_secret postgres-admin-password)"
          MVP_PROVISIONING_PASSWORD="$(read_secret mvp-provisioning-password)"
          MVP_RUNTIME_PASSWORD="$(read_secret mvp-runtime-password)"
          echo "::add-mask::$PGPASSWORD"
          echo "::add-mask::$MVP_PROVISIONING_PASSWORD"
          echo "::add-mask::$MVP_RUNTIME_PASSWORD"
          export PGPASSWORD MVP_PROVISIONING_PASSWORD MVP_RUNTIME_PASSWORD
          export PGHOST="${{ steps.infra.outputs.serverHost }}" PGPORT=5432 PGUSER=efradmin
          python -m evidence_first_rag.db.provision --recreate | tee provision.txt

      # Section 4.8: the deployed checks, from this runner, inside the firewall
      # window. The fast groups run first, each whatever the others did; a
      # failure among them skips the slow groups, recorded as not run (#265).
      # DP-003's scan always runs. The step fails if any group failed, which
      # is what starts the rollback below in deploy mode.
      - name: Run the deployed checks
        id: checks
        run: |
          set -uo pipefail
          # The commit the checks hold the deployment to: this one in a deploy,
          # the running one in checks mode.
          COMMIT="${DEPLOYED_COMMIT:-$COMMIT}"
          # The groups, in the order they run. `cases` narrows a checks run to
          # some of them; a deploy runs them all. DP-006 compares the deployed
          # runner's verdicts, so asking for it runs DP-007 too. DP-003's scan
          # is not a group: it gates the upload below, so it always runs.
          # Not `GROUPS`: bash reserves that name and ignores an assignment.
          check_groups="AZURE HTTP DP-004 DP-007 WF/MC DP-008 DP-006"
          selected="$check_groups"
          if [ "$MODE" = "checks" ] && [ -n "$CASES" ]; then
            selected=""
            for group in $(tr ',' ' ' <<<"$CASES"); do
              [[ " $check_groups " == *" $group "* ]] || { echo "unknown group in cases: $group"; exit 2; }
              selected="$selected $group"
            done
            [[ " $selected " == *" DP-006 "* ]] && selected="$selected DP-007"
          fi
          want() { [[ " $selected " == *" $1 "* ]]; }
          skipped=""
          # Every exit records what ran and what did not: an early exit (a
          # health wait or a vault read) ran no group and skipped them all
          # (#266 N6).
          recorded=""
          trap '[ -n "$recorded" ] || { echo "skipped=$(xargs <<<"$selected")"; echo "ran="; } >> "$GITHUB_OUTPUT"' EXIT
          # The restarted apps pull a fresh image before they serve. Wait,
          # bounded, until surface answers its health route with JSON, so a
          # slow start is not read as a failed deploy (#237 B2).
          ready=""
          for attempt in $(seq 1 30); do
            if curl --silent --fail --max-time 10 "https://${{ steps.infra.outputs.surfaceHost }}/v1/health" \
                | python -c 'import json, sys; json.load(sys.stdin)' 2>/dev/null; then
              ready=yes
              break
            fi
            sleep 20
          done
          if [ -z "$ready" ]; then
            echo "surface did not become healthy within 10 minutes"
            exit 1
          fi
          # relay has no health route: any JSON answer from it, even the
          # refusal of an empty GET, shows the process is serving (#239 N5).
          ready=""
          for attempt in $(seq 1 30); do
            if curl --silent --max-time 10 "https://${{ steps.infra.outputs.relayHost }}/chat" \
                | python -c 'import json, sys; json.load(sys.stdin)' 2>/dev/null; then
              ready=yes
              break
            fi
            sleep 20
          done
          if [ -z "$ready" ]; then
            echo "relay did not start serving within 10 minutes"
            exit 1
          fi
          read_secret() { az keyvault secret show --vault-name "$KEY_VAULT" --name "$1" --query value --output tsv; }
          # A vault read that fails stops here, before any check runs, so it is
          # never recorded as a failed check (#237 B6).
          MVP_PROVISIONING_PASSWORD="$(read_secret mvp-provisioning-password)" || { echo "Key Vault read failed"; exit 2; }
          MVP_RUNTIME_PASSWORD="$(read_secret mvp-runtime-password)" || { echo "Key Vault read failed"; exit 2; }
          # Read for DP-003's known-value test only, and handed to the scan
          # alone, so no check runs with the admin password (#254 N8).
          admin_password="$(read_secret postgres-admin-password)" || { echo "Key Vault read failed"; exit 2; }
          if [ -z "$MVP_PROVISIONING_PASSWORD" ] || [ -z "$MVP_RUNTIME_PASSWORD" ] || [ -z "$admin_password" ]; then
            echo "Key Vault returned an empty value"
            exit 2
          fi
          echo "::add-mask::$admin_password"
          echo "::add-mask::$MVP_PROVISIONING_PASSWORD"
          echo "::add-mask::$MVP_RUNTIME_PASSWORD"
          export MVP_PROVISIONING_PASSWORD MVP_RUNTIME_PASSWORD
          export PGHOST="${{ steps.infra.outputs.serverHost }}" PGPORT=5432
          failed=""
          # The fast groups: about two minutes together, none needing the
          # others' output.
          # DP-014 and DP-003's settings half, read off Azure's resource state.
          if want AZURE; then
            python -m evidence_first_rag.deploy.azure_checks \
              --group "$RESOURCE_GROUP" \
              --registry "${{ steps.infra.outputs.registryName }}" \
              --surface "${{ steps.infra.outputs.surfaceName }}" \
              --relay "${{ steps.infra.outputs.relayName }}" \
              --deploy-identity id-efr-github-deploy \
              --commit "$COMMIT" \
              || failed="$failed AZURE"
          fi
          # DP-005, DP-009, DP-010, DP-012 and DP-019 over the network. DP-012
          # is the one model call a run makes.
          if want HTTP; then
            python -m evidence_first_rag.deploy.http_checks \
              --surface "${{ steps.infra.outputs.surfaceHost }}" \
              --relay "${{ steps.infra.outputs.relayHost }}" \
              --origin "$CORS_ORIGIN" \
              || failed="$failed HTTP"
          fi
          # DP-004: the runtime identity cannot write.
          if want DP-004; then
            python -m evidence_first_rag.deploy.deployed writes | tee writes.json || failed="$failed DP-004"
          fi
          # The slow groups, skipped once a fast one has failed: the run has
          # already failed, and minutes spent here would not change that.
          if [ -n "$failed" ]; then
            for group in DP-007 WF/MC DP-008 DP-006; do
              want "$group" && skipped="$skipped $group"
            done
            echo "skipped after a fast failure:$skipped"
            selected="$(tr ' ' '\n' <<<"$selected" | grep -vxF -e DP-007 -e WF/MC -e DP-008 -e DP-006 | tr '\n' ' ')"
          fi
          # DP-007: the mvp-v0.1 Section 4.9 runner, as the runtime identity,
          # and as mvp_provisioning for its Group C invariants only.
          if want DP-007; then
            python -m evidence_first_rag.conformance.runner --artifact conformance.json || failed="$failed DP-007"
          fi
          # The api-v0.1 WF rows and the mcp-v0.1 MC rows that need no model and
          # no fault, over HTTPS against surface (tests_stack, #257).
          if want WF/MC; then
            EFR_STACK_URL="https://${{ steps.infra.outputs.surfaceHost }}" \
              python -m unittest discover --start-directory tests_stack --top-level-directory . --verbose \
              || failed="$failed WF/MC"
          fi
          # DP-008: a fresh SAMPLE_* marker in a request body to each app, then
          # both apps' log stores read until each shows its route (#255). It
          # waits out the relay's rate window DP-009 filled.
          # DP-020 then looks for this runner's own address in the same
          # stores. It is masked before anything could print it, and passed
          # in the environment, never on a command line.
          if want DP-008; then
            RUNNER_ADDRESS="$(curl --silent --show-error --fail https://api.ipify.org || true)"
            [ -n "$RUNNER_ADDRESS" ] && echo "::add-mask::$RUNNER_ADDRESS"
            export RUNNER_ADDRESS
            python -m evidence_first_rag.deploy.log_checks \
              --group "$RESOURCE_GROUP" \
              --surface "${{ steps.infra.outputs.surfaceName }}" \
              --relay "${{ steps.infra.outputs.relayName }}" \
              --surface-host "${{ steps.infra.outputs.surfaceHost }}" \
              --relay-host "${{ steps.infra.outputs.relayHost }}" \
              || failed="$failed DP-008"
          fi
          # DP-006 and DP-007: the same commit provisioned locally, its runner
          # run there, and the two stable digests and verdicts compared. In
          # checks mode the checkout may be newer than the deployed commit, and
          # a difference that makes is reported, not hidden.
          if want DP-006; then
            python -m evidence_first_rag.deploy.digests record --conformance conformance.json --out stable-digest.json \
              || failed="$failed DP-006"
            (
              export PGHOST=localhost PGPORT=5432 PGSSLMODE=disable PGUSER=postgres
              export PGPASSWORD=local_superuser_not_a_secret
              export MVP_PROVISIONING_PASSWORD=local_provisioning_not_a_secret
              export MVP_RUNTIME_PASSWORD=local_runtime_not_a_secret
              python -m evidence_first_rag.db.provision --recreate > /dev/null &&
              # A failing local verdict is DP-007's to report, so the digest is
              # recorded and compared whatever the local run concluded (#243 N5).
              { python -m evidence_first_rag.conformance.runner --artifact local-conformance.json > /dev/null || true; } &&
              python -m evidence_first_rag.deploy.digests record --conformance local-conformance.json --out local-stable-digest.json
            ) || failed="$failed LOCAL"
            python -m evidence_first_rag.deploy.digests compare \
              --deployed-digest stable-digest.json --local-digest local-stable-digest.json \
              --deployed-conformance conformance.json --local-conformance local-conformance.json \
              | tee compare.json || failed="$failed DP-006/DP-007"
          fi
          echo "skipped=${skipped# }" >> "$GITHUB_OUTPUT"
          echo "ran=$(xargs <<<"$selected")" >> "$GITHUB_OUTPUT"
          recorded=yes
          # DP-003's image, workflow and artifact half, last, so every artifact
          # this step wrote is scanned for the passwords it holds (#253). A
          # finding is published as an output, so the upload below withholds
          # the files that may carry the value (#254 B5).
          PGPASSWORD="$admin_password" python -m evidence_first_rag.deploy.secrets_scan \
            --image "${{ steps.infra.outputs.registryLoginServer }}/evidence-first-rag:$COMMIT" \
            --workflows .github/workflows \
            --artifacts conformance.json writes.json http-checks.json azure-checks.json \
              stable-digest.json local-conformance.json local-stable-digest.json compare.json log-checks.json \
            --out secret-scan.json \
            || { failed="$failed DP-003"; echo "secret_scan=fail" >> "$GITHUB_OUTPUT"; }
          if [ -n "$failed" ]; then
            echo "failed:$failed"
            exit 1
          fi

      # Section 4.8: a failed deploy is rolled back in both halves to the last
      # passing commit: its database, provisioned by the same module from that
      # commit's files, and its image, by that commit's tag. Before the first
      # passing deploy there is nothing to roll back to, and the record says so.
      - name: Roll back to the last passing commit
        id: rollback
        # From the moment the template has repointed the apps, any failure is
        # rolled back (#237 B1). The image half always; the database half only
        # when the firewall window opened, since otherwise it was not touched.
        # A checks run deployed nothing, so there is nothing to undo.
        if: failure() && steps.infra.outcome == 'success' && env.MODE == 'deploy'
        run: |
          set -euo pipefail
          target="$(python -m evidence_first_rag.deploy.deployed last-passing --excluding "$COMMIT")"
          if [ -z "$target" ]; then
            echo "No passing deploy is recorded; nothing to roll back to."
            echo "target=" >> "$GITHUB_OUTPUT"
            echo "result=nothing to roll back to" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          # The image half first: that commit's image is still in the
          # registry, because no image is deleted.
          image="${{ steps.infra.outputs.registryLoginServer }}/evidence-first-rag:$target"
          for app in "${{ steps.infra.outputs.surfaceName }}" "${{ steps.infra.outputs.relayName }}"; do
            az webapp config set --resource-group "$RESOURCE_GROUP" --name "$app" \
              --linux-fx-version "DOCKER|$image" --output none
            az webapp restart --resource-group "$RESOURCE_GROUP" --name "$app"
          done
          if [ "${{ steps.firewall.outputs.rule }}" = "" ]; then
            echo "database=untouched" >> "$GITHUB_OUTPUT"
            echo "result=rolled back" >> "$GITHUB_OUTPUT"
            echo "The firewall never opened, so the database was not changed."
            exit 0
          fi
          git fetch --quiet origin "$target"
          git worktree add --detach previous "$target"
          read_secret() { az keyvault secret show --vault-name "$KEY_VAULT" --name "$1" --query value --output tsv; }
          PGPASSWORD="$(read_secret postgres-admin-password)"
          MVP_PROVISIONING_PASSWORD="$(read_secret mvp-provisioning-password)"
          MVP_RUNTIME_PASSWORD="$(read_secret mvp-runtime-password)"
          echo "::add-mask::$PGPASSWORD"
          echo "::add-mask::$MVP_PROVISIONING_PASSWORD"
          echo "::add-mask::$MVP_RUNTIME_PASSWORD"
          export PGPASSWORD MVP_PROVISIONING_PASSWORD MVP_RUNTIME_PASSWORD
          export PGHOST="${{ steps.infra.outputs.serverHost }}" PGPORT=5432 PGUSER=efradmin
          # The same module, run from the previous commit's own source and files.
          (cd previous && PYTHONPATH=src python -m evidence_first_rag.db.provision --recreate)
          echo "database=restored" >> "$GITHUB_OUTPUT"
          # The restored state, checked by the previous commit's own runner.
          (cd previous && PYTHONPATH=src python -m evidence_first_rag.conformance.runner --artifact ../restored-conformance.json)
          # DP-011: the restored stable digest equals the last passing run's.
          python -m evidence_first_rag.deploy.digests record --conformance restored-conformance.json --out restored-digest.json
          python -m evidence_first_rag.deploy.deployed expected-digest --commit "$target" --out expected-digest.json
          # The result is recorded only once DP-011 has answered, so a restored
          # state that differs is never recorded as a clean rollback (#243 B1, B2).
          compared=0
          python -m evidence_first_rag.deploy.digests restored --digest restored-digest.json --expected expected-digest.json \
            > restored-compare.json || compared=$?
          cat restored-compare.json
          if [ "$compared" -eq 0 ]; then
            echo "result=rolled back" >> "$GITHUB_OUTPUT"
          else
            echo "result=rolled back; restored state differs from the last passing run" >> "$GITHUB_OUTPUT"
          fi
          exit "$compared"

      - name: Close the database firewall
        if: always() && steps.firewall.outputs.rule != ''
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "$RESOURCE_GROUP" \
            --server-name "${{ steps.infra.outputs.serverName }}" \
            --name "${{ steps.firewall.outputs.rule }}" \
            --yes --output none || echo "no rule to remove"

      # Section 4.8: the commit, the image digest, the date, and the run's
      # triggering actor and URL, which identify the account and the run. The
      # recorded human decision is the owner's merge of the commit (Section 4.2).
      - name: Write the deploy record
        if: always()
        run: |
          python - <<'PY'
          import datetime, json, os
          record = {
              # A checks run deployed nothing: it is never a rollback target,
              # and never the Section 4.8 acceptance artifact (#265).
              "mode": os.environ["MODE"],
              "checks_ran": os.environ["RAN"] or None,
              "checks_skipped": os.environ["SKIPPED"] or None,
              "commit": os.environ.get("DEPLOYED_COMMIT") or os.environ["COMMIT"],
              # The checkout the local comparison and the expected results
              # came from, which in checks mode may differ from `commit`
              # (#266 N8).
              "checkout_commit": os.environ["GITHUB_SHA"],
              "image_digest": os.environ["DIGEST"] or None,
              "date": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "triggering_actor": os.environ["TRIGGERING_ACTOR"],
              "run_url": os.environ["RUN_URL"],
              "outcome": os.environ["OUTCOME"],
              "provisioned": open("provision.txt").read().strip() if os.path.exists("provision.txt") else None,
              # DP-011's reference for any later rollback to this commit.
              "stable_digest": json.load(open("stable-digest.json")) if os.path.exists("stable-digest.json") else None,
              "deployed_checks": {"success": "pass", "failure": "fail"}.get(os.environ["CHECKS"], "not run"),
              "rolled_back_to": os.environ["ROLLBACK"] or None,
              # What happened, not the step's exit status: a step that found
              # nothing to roll back to succeeds, and says so here (#237 B3).
              "rollback_outcome": (os.environ["ROLLBACK_RESULT"] or ("failed" if os.environ["ROLLBACK_OUTCOME"] == "failure" else None)),
              "rollback_database": os.environ["ROLLBACK_DATABASE"] or None,
              # The comparisons themselves, so the committed record carries
              # the evidence and not only a verdict (#243 B2, N4).
              "restored_digest": json.load(open("restored-digest.json")) if os.path.exists("restored-digest.json") and os.path.getsize("restored-digest.json") else None,
              "dp_011": json.load(open("restored-compare.json")) if os.path.exists("restored-compare.json") and os.path.getsize("restored-compare.json") else None,
              "digest_comparison": json.load(open("compare.json")) if os.path.exists("compare.json") and os.path.getsize("compare.json") else None,
              "local_stable_digest": json.load(open("local-stable-digest.json")) if os.path.exists("local-stable-digest.json") and os.path.getsize("local-stable-digest.json") else None,
          }
          with open("deploy-record.json", "w") as handle:
              json.dump(record, handle, indent=2)
          PY
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          RAN: ${{ steps.checks.outputs.ran }}
          SKIPPED: ${{ steps.checks.outputs.skipped }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ job.status }}
          CHECKS: ${{ steps.checks.outcome }}
          ROLLBACK: ${{ steps.rollback.outputs.target }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
          ROLLBACK_RESULT: ${{ steps.rollback.outputs.result }}
          ROLLBACK_DATABASE: ${{ steps.rollback.outputs.database }}

      # DP-003 over what the checks step could not see: the deploy record and
      # the rollback records are written after it, and the record embeds
      # provision.txt, the output of a step that held all three passwords
      # (#254 B3). A finding fails the job, and the upload below then
      # withholds every file but the two scan records (#254 B5).
      - name: Scan the deploy record
        id: record_scan
        if: always() && steps.infra.outcome == 'success'
        run: |
          set -uo pipefail
          read_secret() { az keyvault secret show --vault-name "$KEY_VAULT" --name "$1" --query value --output tsv; }
          PGPASSWORD="$(read_secret postgres-admin-password)" || { echo "Key Vault read failed"; exit 1; }
          MVP_PROVISIONING_PASSWORD="$(read_secret mvp-provisioning-password)" || { echo "Key Vault read failed"; exit 1; }
          MVP_RUNTIME_PASSWORD="$(read_secret mvp-runtime-password)" || { echo "Key Vault read failed"; exit 1; }
          echo "::add-mask::$PGPASSWORD"
          echo "::add-mask::$MVP_PROVISIONING_PASSWORD"
          echo "::add-mask::$MVP_RUNTIME_PASSWORD"
          export PGPASSWORD MVP_PROVISIONING_PASSWORD MVP_RUNTIME_PASSWORD
          # 1 is a finding, published so the upload below withholds the files;
          # any other failure is a scan that did not finish (#260 N11).
          status=0
          python -m evidence_first_rag.deploy.secrets_scan \
            --workflows none \
            --artifacts deploy-record.json provision.txt restored-conformance.json \
              restored-compare.json restored-digest.json expected-digest.json \
            --out secret-scan-record.json || status=$?
          [ "$status" -ne 1 ] || echo "finding=yes" >> "$GITHUB_OUTPUT"
          exit "$status"

      # When the record scan could not finish but found nothing, the files the
      # checks step's own scan cleared are still published, so the run's
      # evidence survives. The deploy record and the rollback records, which
      # no finished scan cleared, stay withheld (#260 N11).
      - name: Upload the checks evidence
        if: always() && steps.record_scan.outcome == 'failure' && steps.record_scan.outputs.finding != 'yes' && steps.checks.outputs.secret_scan != 'fail'
        uses: actions/upload-artifact@v4
        with:
          name: checks-evidence-${{ env.MODE }}-${{ env.DEPLOYED_COMMIT || github.sha }}
          path: |
            conformance.json
            writes.json
            http-checks.json
            azure-checks.json
            stable-digest.json
            local-conformance.json
            local-stable-digest.json
            compare.json
            log-checks.json
          if-no-files-found: warn

      # Withheld when either scan found a secret, so a file carrying a value
      # is never published. A skipped record scan (no infrastructure) is not
      # a finding, hence `!= 'failure'` (#254 B5).
      - name: Upload the deploy record
        if: always() && steps.record_scan.outcome != 'failure' && steps.checks.outputs.secret_scan != 'fail'
        uses: actions/upload-artifact@v4
        with:
          # Named for the mode and the commit the record holds, which in checks
          # mode is the deployed one, not this checkout (#266 O1).
          name: deploy-record-${{ env.MODE }}-${{ env.DEPLOYED_COMMIT || github.sha }}
          path: |
            deploy-record.json
            conformance.json
            writes.json
            http-checks.json
            azure-checks.json
            restored-conformance.json
            local-conformance.json
            compare.json
            restored-compare.json
            restored-digest.json
            expected-digest.json
            stable-digest.json
            local-stable-digest.json
            log-checks.json
            secret-scan.json
            secret-scan-record.json
          if-no-files-found: warn

      # The scan records alone, uploaded whatever the scans found: they name
      # a finding's file and test, never its value, so the evidence of a
      # finding survives the upload above being withheld (#254 B5).
      - name: Upload the scan records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-${{ env.MODE }}-${{ env.DEPLOYED_COMMIT || github.sha }}
          path: |
            secret-scan.json
            secret-scan-record.json
          if-no-files-found: warn
