name: Repository checks

on:
  pull_request:
  # #21. The agent loop's Writer pushes with GITHUB_TOKEN, and GitHub starts
  # no workflow from an event that token raised — so the `pull_request:
  # synchronize` that push would otherwise fire never happens, and this
  # workflow never runs on the head the loop is about to label
  # `agent:ready-for-human-merge`. A `workflow_dispatch` raised with
  # GITHUB_TOKEN is GitHub's documented exception, so the loop dispatches this
  # explicitly after its push and waits for the conclusion. Additive: the
  # `pull_request` trigger above is unchanged and stays the normal path.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-checks:
    name: repository-checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed lines for whitespace errors
        # The two shas come from the pull request event when there is one. On a
        # dispatched run there is no pull request, so they are resolved from the
        # checkout instead: the dispatched ref is HEAD, and the base is the
        # default branch.
        #
        # That fallback ASSUMES the pull request is based on the default branch
        # (#113 O3). For a stacked pull request based on another branch, the
        # dispatched run checks a wider range than its own `pull_request` run
        # does, so a whitespace error inherited from the parent branch would
        # fail it. The direction is safe -- the range is never narrower, so
        # nothing passes that should not -- and every pull request in this
        # repository currently targets `main`. Resolving the base from the pull
        # request associated with the ref is the fix if that stops being true.
        #
        # `fetch-depth: 0` above is what makes either range available at all,
        # and the `:-` fallbacks are what keep the step from running
        # `git diff --check "..."` on two empty strings when there is no pull
        # request event -- failing for a reason that has nothing to do with
        # whitespace. Two mechanisms, kept in separate paragraphs (#113 O7):
        # my own #113 O3 edit ran them together, so "without this" read as
        # `fetch-depth: 0`, which is exactly the misleading-comment defect that
        # B1 and B3 raised as BLOCKING against the neighbouring workflow file.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          base="${BASE_SHA:-$(git rev-parse "origin/$BASE_REF")}"
          head="${HEAD_SHA:-$(git rev-parse HEAD)}"
          git diff --check "$base...$head"

      # Shared with the agent loop's checks manifest so both verify the same
      # thing with the same code.
      - name: Validate local Markdown links
        run: python3 scripts/checks/validate_links.py

      - name: Validate the registered fixtures
        run: python3 scripts/checks/validate_fixtures.py

      - name: Fixture check unit tests
        # The negative cases: each breaks one rule on a copy of the fixtures
        # and asserts the check above notices.
        run: python3 scripts/checks/test_validate_fixtures.py

      - name: Scan for sensitive strings
        # Charter Section 11's release condition, run on every pull request
        # rather than once at the gate: credentials, internal URLs, local
        # machine paths, and personal information anywhere in the tree.
        run: python3 scripts/checks/scan_sensitive_strings.py

      - name: Sensitive-string scan unit tests
        # The negative cases: each breaks one rule in a tree the test builds
        # and asserts the scan above notices, and each exemption is probed
        # from both sides.
        run: python3 scripts/checks/test_scan_sensitive_strings.py

      - name: Scan the Git history for sensitive strings
        # Charter Section 11 asks for the history as well as the tree. Needs
        # the fetch-depth: 0 checkout above: on a shallow clone the scan
        # reports CANNOT RUN rather than passing over a truncated history.
        run: python3 scripts/checks/scan_history_sensitive_strings.py

      - name: Sensitive-string history scan unit tests
        # The negative cases: each builds a repository, puts one thing in its
        # history, and asserts what the scan says — including the case the
        # tree scan cannot see, a credential committed and then deleted.
        run: python3 scripts/checks/test_scan_history_sensitive_strings.py

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Package unit tests
        # The type surface of the MVP runtime contract. Standard library only,
        # so a clean checkout needs no install step; tests/__init__.py puts
        # src/ on the path, which is why the command is identical here and in
        # the checks manifest, which spawns commands without a shell.
        run: python3 -m unittest discover --start-directory tests --top-level-directory .

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Agent loop unit tests
        # The glob is quoted deliberately: node's test runner expands it
        # itself, so the same form works in CI and in the checks manifest,
        # which spawns commands without a shell.
        run: node --test "scripts/agent/*.test.mjs" "ui/*.test.mjs"

  # #101. `repository-checks` above installs nothing, so every test whose
  # module needs `anthropic` or `psycopg` skips there: the adapter and
  # database test modules are imported, found unimportable, and reported as
  # skips rather than failures. A skip is green, so the job that gates every
  # pull request passes without having executed those tests at all. This job
  # is the same test tree with the optional dependencies installed, so the
  # adapter tests actually run.
  #
  # No test reaches the network: the only construction of `anthropic.Anthropic`
  # in the package is `client.py`'s `from_environment`, which no test calls —
  # the adapter tests build the client with a recording double instead. What
  # installing `anthropic` changes here is whether the modules import, not
  # whether anything is sent.
  adapter-checks:
    name: adapter-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      # `.[adapter,api]` is the package plus both extras, and the package's
      # own dependency list carries psycopg — so this one command installs
      # every one of the imports the skips above are waiting on, from
      # pyproject.toml rather than from a command line that can drift from it.
      #
      # The `api` extra joined it when the HTTP surface landed: without it
      # every test in tests/test_api_surface.py is a skip, and a skip is green,
      # which is the failure this job exists to prevent. Approved as a recorded
      # owner decision on #178.
      - name: Install the package with its optional dependencies
        run: python -m pip install --quiet -e ".[adapter,api]"

      - name: Package unit tests with the optional dependencies installed
        # The same command as `repository-checks`, deliberately: the
        # difference between the two jobs is the environment, not the tests.
        run: python3 -m unittest discover --start-directory tests --top-level-directory .

  # Section 4.1, 4.3, 4.11 and 6 are claims about a database, so the evidence
  # for them belongs where anyone can re-run it. Issue #12: "It passes
  # locally" is not acceptance evidence for a determinism claim.
  database-checks:
    name: database-checks
    runs-on: ubuntu-latest

    services:
      postgres:
        # Section 3.4 pins PostgreSQL at the major version; any patch release
        # satisfies the contract.
        image: postgres:17
        env:
          # Not a secret. This password reaches a container that exists only
          # for this job, listens on the runner's loopback, and is destroyed
          # with it. The two contract identities get their own passwords
          # below, also job-scoped.
          POSTGRES_PASSWORD: ci_superuser_not_a_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci_superuser_not_a_secret
      MVP_PROVISIONING_PASSWORD: ci_provisioning_not_a_secret
      MVP_RUNTIME_PASSWORD: ci_runtime_not_a_secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      # Installs the package and the one runtime dependency the schema slice
      # chose, from pyproject.toml, so the dependency list is the single
      # source of truth rather than a command line that can drift from it.
      - name: Install the package
        # `.[api]` because tests_database/test_api_workflows.py drives the
        # Section 8.1 workflow fixtures -- WF-003, the whole target path,
        # among them -- through the HTTP surface against the registered data,
        # and without the extra the module skips. A skip is green, which is
        # the failure #101 put the adapter-checks job in the tree to prevent.
        # Approved as a recorded owner decision on #179; the adapter extra is
        # not installed here, because nothing in tests_database/ calls a model.
        run: python -m pip install --quiet -e ".[api]"

      - name: Provision the schema, the roles, and the fixtures
        run: python -m evidence_first_rag.db.provision --recreate

      - name: Data-level invariant check
        # Section 4.9 check C1, and the Section 8 acceptance evidence for
        # Sections 4.1 and 4.2.
        run: python -m evidence_first_rag.db.invariants

      - name: Database tests
        # The four write refusals, the C collation, the repeatability
        # comparison, the no-partial-load rule, and the negative cases that
        # prove the invariant check fails on a schema missing a constraint.
        run: python -m unittest discover --start-directory tests_database --top-level-directory .

  # `api-v0.1` Section 4.7. The one obligation of this repository that cannot
  # be checked by reading files: whether one command actually starts a working
  # stack. `tests/test_local_stack.py` asserts what `compose.yaml` says, which
  # is a weaker thing and says so in its own docstring -- a compose file can be
  # exactly right and the stack still not start.
  #
  # Added by a recorded owner decision on #191, which fixes that it runs on
  # every pull request: a stack that silently stops starting is discovered when
  # someone tries to use it, which is too late. The approval covers this job
  # and nothing else under `.github/`.
  local-stack:
    name: local-stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `--wait` returns when every service is healthy or, for the one-shot
      # provisioning container, has exited successfully -- which is the
      # dependency order compose.yaml declares, waited on rather than slept
      # through. A failure here is the stack not starting, which is the thing
      # this job exists to catch.
      - name: Start the stack with the one command
        run: docker compose up --detach --wait

      - name: Drive the stack through the surface
        # Python from the runner, standard library only: the point is to reach
        # the stack the way a person would, over HTTP, without installing this
        # repository's package beside it. A caller that imported the package
        # would be testing the code again rather than the stack.
        run: |
          python3 - <<'PROBE'
          import json, urllib.error, urllib.request

          BASE = "http://127.0.0.1:8000"
          POWERTRAIN = {
              "project_code": "SAMPLE_PROJECT_ALPHA",
              "revision_label": "SAMPLE_REV_A",
              "network_name": "SAMPLE_NET_POWERTRAIN",
              "snapshot_label": "SAMPLE_SNAP_BASE",
          }

          def call(path, body=None):
              """One request. Returns (status, parsed body)."""
              request = urllib.request.Request(
                  BASE + path,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={} if body is None else {"content-type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      return response.status, json.loads(response.read())
              except urllib.error.HTTPError as refused:
                  return refused.code, json.loads(refused.read())

          def expect(condition, message):
              if not condition:
                  raise SystemExit("FAILED: " + message)
              print("ok:", message)

          # Section 4.5: health reports the three contracts this surface serves,
          # and whether an adapter is configured. Neither is wrapped in the
          # Section 4.2 envelope -- health is not a result.
          status, health = call("/v1/health")
          expect(status == 200, "GET /v1/health is 200")
          expect(
              set(health["contracts"]) == {"api-v0.1", "mvp-v0.1", "entity-discovery-v0.1"},
              f"health names the three contracts: {health['contracts']}",
          )
          expect(
              health["adapter_configured"] is False,
              "health reports no adapter, which is what this stack started without",
          )

          # WF-003, the path this milestone exists for, against the data the
          # stack provisioned -- not a fixture this job carries.
          status, first = call("/v1/query", {"route": "signal_facts", "arguments": dict(POWERTRAIN)})
          expect(
              first["result"]["status"] == "needs_entity_discovery",
              f"a complete scope with no lookup key needs discovery: {first['result']['status']}",
          )

          discovery = POWERTRAIN | {"entity_kind": "signal", "term": "SAMPLE_SIG_GEAR_POSITION"}
          status, second = call("/v1/discover", {"arguments": discovery})
          expect(second["result"]["status"] == "candidates", "the term returns a candidate list")
          candidates = second["result"]["candidates"]
          expect(len(candidates) >= 2, f"more than one candidate: {len(candidates)}")
          digest = second["result"]["evidence_bundle"]["candidate_set_id"]

          status, third = call(
              "/v1/select",
              {
                  "arguments": discovery
                  | {
                      "candidate_set_id": digest,
                      "selected_rank": str(candidates[0]["rank"]),
                      "target_route": "signal_facts",
                  }
              },
          )
          result = third["result"]
          expect(result["status"] == "success", f"the selection answers: {result['status']}")
          expect(bool(result["rows"]), "the answer carries rows")
          expect(isinstance(third["rendered"], str), "the answer carries its rendered text")
          # Charter Section 3.1, on the stack rather than in a unit test.
          expect(result["evidence_bundle"]["selection"] is not None, "the evidence records the selection")
          expect(bool(result["source_trace"]), "the evidence carries the source trace")
          expect(bool(result["limitations"]), "the evidence carries what the answer does not establish")

          # Section 4.7: with no adapter credential, `/v1/ask` refuses and
          # every other route works -- which the four calls above just showed.
          status, refused = call("/v1/ask", {"request_text": "SAMPLE_TEXT"})
          expect(status == 503, f"/v1/ask without a credential is 503: {status}")
          expect(
              refused["refusal"] == "adapter_unavailable",
              f"and refuses by name: {refused.get('refusal')}",
          )

          # Section 4.6: the page is there to open.
          with urllib.request.urlopen(BASE + "/") as page:
              text = page.read().decode()
          expect(page.status == 200, "GET / is the page")
          expect('id="discover-panel"' in text, "the page carries its discovery panel")
          PROBE

      - name: The surface process holds no provisioning credential
        # `tests/test_local_stack.py` asserts this against the file. Here it is
        # read off the running process, which is what Section 4.7's sentence is
        # about, and which no response from the surface would ever reveal.
        run: |
          set -o pipefail
          environment="$(docker compose exec -T surface env)"
          for name in MVP_PROVISIONING_PASSWORD PGPASSWORD PGUSER; do
            if grep -q "^${name}=" <<<"$environment"; then
              echo "FAILED: the surface process carries ${name}"
              exit 1
            fi
            echo "ok: the surface process does not carry ${name}"
          done

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
