name: Repository checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  repository-checks:
    name: repository-checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed lines for whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

      # Shared with the agent loop's checks manifest so both verify the same
      # thing with the same code.
      - name: Validate local Markdown links
        run: python3 scripts/checks/validate_links.py

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Agent loop unit tests
        run: node --test scripts/agent/
