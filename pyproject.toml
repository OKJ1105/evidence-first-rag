[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-first-rag"
# The number that matters in this repository is the contract version in
# Section 1 of docs/contracts/mvp-v0.1.md. This one exists because packaging
# metadata requires it, and it moves when the repository releases something,
# which it has not yet.
version = "0.0.0"
description = "Evidence-First RAG Runtime: bounded, read-only answers over structured engineering data."
readme = "README.md"
requires-python = ">=3.11"
# All rights reserved (LICENSE, #307). A classifier rather than a PEP 639
# `license` expression, which needs setuptools 77 where the floor above is 68;
# setuptools already copies LICENSE into a built distribution by its default
# `license-files` patterns.
classifiers = ["License :: Other/Proprietary License"]

# The PostgreSQL driver, chosen by the schema slice as the package layout
# slice deferred it. psycopg 3 is the current generation of the driver and is
# what the loader in src/evidence_first_rag/db/ binds parameters through;
# Section 4.4 prohibits string interpolation into SQL, and named parameter
# binding is the driver feature that obligation rests on.
#
# It is the only runtime dependency. Everything outside src/evidence_first_rag/db/
# is standard library, and the tests in tests/ need neither the driver nor a
# database, so the agent loop's checks manifest still runs from a clean
# checkout with no install step. The suite in tests_database/ needs both and
# runs in CI against a service container.
dependencies = ["psycopg[binary]>=3.2"]

# The adapter's SDK, and deliberately an extra rather than a dependency.
# Charter Section 3.1 puts the model outside the path that produces facts, and
# contract Section 4.6 confines it to proposing a route: the runtime, the
# registry, the provisioning path and the conformance runner all execute
# without it, and `pip install evidence-first-rag` gives you a system that
# answers questions with no model SDK present at all. Installing the extra is
# how someone opts into the Milestone 2 comparison, which is the only thing
# that calls a model.
[project.optional-dependencies]
adapter = ["anthropic>=1.4"]

# The HTTP surface, and an extra for the same reason the adapter is one: the
# runtime, the registry, the provisioning path and the conformance runner all
# execute without it, and `pip install evidence-first-rag` still gives a system
# with one runtime dependency. Installing this extra is how someone opts into
# serving contract `api-v0.1` over HTTP.
#
# FastAPI is used as a router and a body parser and as nothing else; see
# docs/adr/0003-fastapi-for-the-http-surface.md for why a framework whose
# defaults this contract mostly forbids is still the right choice, and
# src/evidence_first_rag/api/app.py for which of its defaults are replaced.
# `httpx` is here because `fastapi.testclient` needs it -- the surface's own
# tests drive the app through it, and without it every test in
# tests/test_api_surface.py skips, which is green and proves nothing (#101).
# `mcp` is here rather than in an extra of its own because contract `mcp-v0.1`
# Section 4.5 serves the tool surface from the same process as `api-v0.1`'s,
# over the same `Services`: the two are one server, and an install that opts
# into serving one serves both. It also means the CI jobs that install this
# extra run `tests/test_mcp_surface.py` without a workflow change.
api = [
    "fastapi>=0.115",
    # `mcp` 2.2 itself requires uvicorn >= 0.31.1; stating the same floor here
    # keeps the two from being resolved against each other.
    "uvicorn[standard]>=0.31.1",
    "httpx>=0.27",
    "mcp>=2.2,<3",
]

[project.urls]
Repository = "https://github.com/OKJ1105/evidence-first-rag"

[tool.setuptools.packages.find]
where = ["src"]
