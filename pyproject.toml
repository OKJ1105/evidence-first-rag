[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-first-rag"
# The number that matters in this repository is the contract version in
# Section 1 of docs/contracts/mvp-v0.1.md. This one exists because packaging
# metadata requires it, and it moves when the repository releases something,
# which it has not yet.
version = "0.0.0"
description = "Evidence-First RAG Runtime: bounded, read-only answers over structured engineering data."
readme = "README.md"
requires-python = ">=3.11"

# The PostgreSQL driver, chosen by the schema slice as the package layout
# slice deferred it. psycopg 3 is the current generation of the driver and is
# what the loader in src/evidence_first_rag/db/ binds parameters through;
# Section 4.4 prohibits string interpolation into SQL, and named parameter
# binding is the driver feature that obligation rests on.
#
# It is the only runtime dependency. Everything outside src/evidence_first_rag/db/
# is standard library, and the tests in tests/ need neither the driver nor a
# database, so the agent loop's checks manifest still runs from a clean
# checkout with no install step. The suite in tests_database/ needs both and
# runs in CI against a service container.
dependencies = ["psycopg[binary]>=3.2"]

# The adapter's SDK, and deliberately an extra rather than a dependency.
# Charter Section 3.1 puts the model outside the path that produces facts, and
# contract Section 4.6 confines it to proposing a route: the runtime, the
# registry, the provisioning path and the conformance runner all execute
# without it, and `pip install evidence-first-rag` gives you a system that
# answers questions with no model SDK present at all. Installing the extra is
# how someone opts into the Milestone 2 comparison, which is the only thing
# that calls a model.
[project.optional-dependencies]
adapter = ["anthropic>=1.4"]

[project.urls]
Repository = "https://github.com/OKJ1105/evidence-first-rag"

[tool.setuptools.packages.find]
where = ["src"]
